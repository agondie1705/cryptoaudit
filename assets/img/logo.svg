<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ringGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A3FFC" />
      <stop offset="50%" stop-color="#5C67FF" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>

    <path id="textArc" d="M 105 250 A 145 145 0 0 0 395 250" fill="none" />
  </defs>

  <!-- Franja más ancha para que quepa el texto grande sin salirse -->
  <circle cx="250" cy="250" r="145" fill="none" stroke="url(#ringGradient)" stroke-width="45" />

  <path d="M 250 140 
       Q 250 250 160 250 
       Q 250 250 250 360 
       Q 250 250 340 250 
       Q 250 250 250 140 Z" fill="none" stroke="#7652E2" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Texto mucho más grande y centrado dentro de la franja -->
  <text fill="#FFFFFF" font-family="&#39;Cinzel&#39;, &#39;Times New Roman&#39;, sans-serif" font-size="42" font-weight="bold" letter-spacing="8">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle" dominant-baseline="central">
      NEBULA
    </textPath>
  </text>
</svg>